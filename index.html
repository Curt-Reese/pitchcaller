<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Liberty Pitch Calling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 8px; }
    .top-row { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .top-row h2 { margin: 0; flex: 1; min-width: 220px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .panel { border: 1px solid #ccc; padding: 8px; border-radius: 6px; flex: 1; min-width: 220px; }
    .games-panel { flex: 0 1 320px; }
    .pitcher-panel { flex: 0 1 280px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .panel-header h3 { margin: 0; }
    .panel-summary { font-size: 12px; color: #555; margin-left: 6px; }
    .collapse-toggle { padding: 4px 8px; font-size: 12px; }
    .collapsible-content { margin-top: 8px; }
    button { padding: 6px 10px; margin: 2px; border-radius: 4px; border: 1px solid #888; background:#f5f5f5; }
    button.active { background:#007bff; color:#fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { border: 1px solid #ccc; padding: 4px; text-align: center; }
    .small { font-size: 12px; }
    .counts-table { margin-top: 0; }
  </style>
</head>
<body>

<div class="top-row">
  <h2>Liberty Pitch Calling</h2>

  <div class="panel pitcher-panel">
    <div class="panel-header">
      <h3>Pitcher <span id="pitcherSummary" class="panel-summary"></span></h3>
      <button id="togglePitcherPanelBtn" class="collapse-toggle" type="button" aria-expanded="false" aria-controls="pitcherPanelBody">
        Show
      </button>
    </div>
    <div id="pitcherPanelBody" class="collapsible-content" style="display:none;">
      <div id="pitchers"></div>
    </div>
  </div>

  <div class="panel games-panel">
    <div class="panel-header">
      <h3>Games</h3>
      <button id="toggleGamesPanelBtn" class="collapse-toggle" type="button" aria-expanded="false" aria-controls="gamesPanelBody">
        Show
      </button>
    </div>
    <div id="gamesPanelBody" class="collapsible-content" style="display:none;">
      <label>Load Game:
        <select id="gameSelect"></select>
      </label>
      <div>
        <button id="newGameBtn" style="margin-top:6px; background:#6f42c1; color:white;">
          New Game
        </button>
      </div>
      <div>
        <button id="exportCsvBtn" style="margin-top:6px; background:#17a2b8; color:white;">
          Export CSV
        </button>
      </div>
      <div>
        <button id="saveGamesBtn" style="margin-top:6px; background:#28a745; color:white;">
          Save Games to File
        </button>
      </div>
      <div>
        <button id="restoreGamesBtn" style="margin-top:6px; background:#ffc107; color:#000;">
          Restore Games from File
        </button>
        <input id="restoreGamesInput" type="file" accept="application/json,.json" style="display:none;" />
      </div>
      <div>
        <button id="deleteGameBtn" style="margin-top:6px; background:#dc3545; color:white;">
          Delete Game
        </button>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="panel">
    <h3>Batter</h3>
    <label>Batter #:
      <input type="number" id="batterNum" min="1" max="20" value="1" style="width:60px;">
    </label><br>
    <label>Total Batters:
      <input type="number" id="totalBatters" min="1" max="20" value="9" style="width:60px;">
    </label>
    <div>
      <button data-hand="RH" class="handBtn active">RH</button>
      <button data-hand="LH" class="handBtn">LH</button>
    </div>
    <button id="newBatterBtn" style="margin-top:6px; background:#28a745; color:white;">
      New Batter
    </button>
  </div>

  <div class="panel">
    <h3>Count</h3>
    <div id="countDisplay" style="font-size:20px;">0-0</div>
    <button id="undoBtn" style="margin-top:6px; background:#dc3545; color:white;">
      Undo Last Pitch
    </button>
  </div>
</div>

<div class="row">
  <div class="panel">
    <h3>Pitch Type</h3>
    <div id="pitchTypes"></div>
  </div>

  <div class="panel">
    <h3>Numbers for Selected Pitch</h3>
    <div id="pitchNumbers"></div>
  </div>

  <div class="panel">
    <h3>Result</h3>
    <div id="results"></div>

    <div id="hitResultsPanel" style="margin-top:6px; display:none;">
      <h4 class="small">Hit Details</h4>
      <div id="hitDetails"></div>
      <div id="hitLocationsPanel" style="margin-top:6px; display:none;"></div>
        <h4 class="small">Hit Location</h4>
        <div id="hitLocations"></div>
      </div>
      <div id="hitOutcomesPanel" style="margin-top:6px; display:none;">
        <h4 class="small">Hit Outcome</h4>
        <div id="hitOutcomes"></div>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <h3>Log</h3>
    <button id="toggleLogPanelBtn" class="collapse-toggle" type="button" aria-expanded="false" aria-controls="logPanelBody">
      Show
    </button>
  </div>
  <div id="logPanelBody" class="collapsible-content" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>Time</th><th>Pitcher</th><th>Batter</th><th>Hand</th>
          <th>Count</th><th>Pitch</th><th>#</th><th>Result</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
</div>

<div class="row">
  <div class="panel">
    <h3>Pitch Counts (Current Game)</h3>
    <table class="counts-table">
      <thead>
        <tr><th>Pitcher</th><th>Total Pitches</th></tr>
      </thead>
      <tbody id="pitchCountsBody"></tbody>
    </table>
  </div>
</div>
<div class="footer">
  <p>&copy; 2026 PitchCaller v1.0</p>
</div>

<script>
// --- GAME ID SUPPORT ---
let currentGameId = localStorage.getItem("currentGameId") || "game_1";

// --- CONFIG ---

const pitchers = ["Miranda", "Nikki", "Alex", "Harper", "Kennedy"];

const pitchMap = {
  FDO: ["124","235","342","412","425","442","444","515","554"],
  FDI: ["043","121","133","153","213","215","345","422","435"],
  FUI: ["131","225","233","414","545"],
  FUO: ["041","144","451","455","544"],
  FI:  ["112","152","211","255","313"],
  FO:  ["011","023","055","145","245"],
  F:   ["045","134","222","223","341"],
  CDO: ["025","111","155","532","533","552"],
  CDI: ["132","151","324","524","534","551"],
  CUO: ["015","224","243","253","323","543"],
  CUI: ["212","244","322","331","445","514"],
  CI:  ["032","114","123","254","314","334","441","521","555"],
  CO:  ["234","251","312","351","415","512","535","542","553"],
  D:   ["013","053","113","332","335","355","452","525"],
  DI:  ["142","241","242","352","423","443","453","541"],
  DO:  ["034","035","143","154","232","325","511","513"],
  CRV: ["031","033","051","135","221","333","421","424"],
  BDC: ["022","052","115","122","344","433"],
  SCW: ["012","141","231","311","354","434"],
  R:   ["021","042","125","315","343"],
  RI:  ["024","214","321","353","431"],
  RO:  ["044","252","411","454","522"]
};

const results = [
  "Strike Looking","Strike Swinging","Ball","Foul"
  ,"In Play","HBP"
];

const hitDetails = [
  "Ground Ball","Line Drive","Fly Ball","Pop Up"
];

const hitOutcomes = [
  "Out","Single","Double","Triple","Home Run", "fielders choice"
];

const hitLocations = [
  "FB","SS","2nd","3rd","P","C","LF",
  "RF","CF"
];

// --- STATE ---
let currentPitcher = pitchers[0];
let currentHand = "RH";
let balls = 0;
let strikes = 0;
let selectedPitchType = null;
let selectedNumber = null;

const UI_STATE_KEY = "pitchCallerUiState";

// --- LOCAL STORAGE HELPERS ---

function getUiState() {
  try {
    return JSON.parse(localStorage.getItem(UI_STATE_KEY) || "{}");
  } catch (error) {
    return {};
  }
}

function saveUiState() {
  try {
    const batterInput = document.getElementById("batterNum");
    const totalBattersInput = document.getElementById("totalBatters");
    const state = {
      currentPitcher,
      currentHand,
      batterNum: batterInput ? batterInput.value : "",
      totalBatters: totalBattersInput ? totalBattersInput.value : "",
      balls,
      strikes,
      selectedPitchType,
      selectedNumber,
      pitcherPanelVisible: document.getElementById("pitcherPanelBody")?.style.display !== "none",
      gamesPanelVisible: document.getElementById("gamesPanelBody")?.style.display !== "none",
      logPanelVisible: document.getElementById("logPanelBody")?.style.display !== "none"
    };
    localStorage.setItem(UI_STATE_KEY, JSON.stringify(state));
  } catch (error) {
    // Ignore storage failures so the app keeps working.
  }
}

function restoreUiState() {
  const saved = getUiState();
  if (saved.currentPitcher && pitchers.includes(saved.currentPitcher)) {
    currentPitcher = saved.currentPitcher;
  }
  if (saved.currentHand) {
    currentHand = saved.currentHand;
  }
  if (typeof saved.balls === "number") balls = saved.balls;
  if (typeof saved.strikes === "number") strikes = saved.strikes;

  const batterInput = document.getElementById("batterNum");
  const totalBattersInput = document.getElementById("totalBatters");
  if (batterInput && saved.batterNum !== undefined) {
    batterInput.value = saved.batterNum;
  }
  if (totalBattersInput && saved.totalBatters !== undefined) {
    totalBattersInput.value = saved.totalBatters;
  }

  if (saved.selectedPitchType && pitchMap[saved.selectedPitchType]) {
    selectedPitchType = saved.selectedPitchType;
  }
  if (saved.selectedNumber) {
    selectedNumber = saved.selectedNumber;
  }

  const pitcherPanel = document.getElementById("pitcherPanelBody");
  const gamesPanel = document.getElementById("gamesPanelBody");
  const logPanel = document.getElementById("logPanelBody");
  if (pitcherPanel) {
    const isVisible = saved.pitcherPanelVisible !== false;
    pitcherPanel.style.display = isVisible ? "block" : "none";
  }
  if (gamesPanel) {
    const isVisible = saved.gamesPanelVisible !== false;
    gamesPanel.style.display = isVisible ? "block" : "none";
  }
  if (logPanel) {
    const isVisible = saved.logPanelVisible !== false;
    logPanel.style.display = isVisible ? "block" : "none";
  }

  const pitcherToggle = document.getElementById("togglePitcherPanelBtn");
  if (pitcherToggle) {
    const isVisible = pitcherPanel && pitcherPanel.style.display !== "none";
    pitcherToggle.textContent = isVisible ? "Hide" : "Show";
    pitcherToggle.setAttribute("aria-expanded", String(isVisible));
  }

  const gamesToggle = document.getElementById("toggleGamesPanelBtn");
  if (gamesToggle) {
    const isVisible = gamesPanel && gamesPanel.style.display !== "none";
    gamesToggle.textContent = isVisible ? "Hide" : "Show";
    gamesToggle.setAttribute("aria-expanded", String(isVisible));
  }

  const logToggle = document.getElementById("toggleLogPanelBtn");
  if (logToggle) {
    const isVisible = logPanel && logPanel.style.display !== "none";
    logToggle.textContent = isVisible ? "Hide" : "Show";
    logToggle.setAttribute("aria-expanded", String(isVisible));
  }

  const selectedPitcherBtn = document.querySelector(`#pitchers button[data-name="${currentPitcher}"]`);
  if (selectedPitcherBtn) {
    document.querySelectorAll("#pitchers button").forEach(b => b.classList.remove("active"));
    selectedPitcherBtn.classList.add("active");
  }

  const selectedHandBtn = document.querySelector(`.handBtn[data-hand="${currentHand}"]`);
  if (selectedHandBtn) {
    document.querySelectorAll(".handBtn").forEach(b => b.classList.remove("active"));
    selectedHandBtn.classList.add("active");
  }

  if (selectedPitchType && pitchMap[selectedPitchType]) {
    document.querySelectorAll("#pitchTypes button").forEach(b => {
      b.classList.toggle("active", b.textContent === selectedPitchType);
    });
    buildPitchNumbers(selectedPitchType);
    document.querySelectorAll("#pitchNumbers button").forEach(b => {
      b.classList.toggle("active", b.textContent === String(selectedNumber));
    });
  }

  updatePitcherSummary();
  updateCountDisplay();
}

function getStoredGameIds() {
  const ids = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith("pitchLog_")) {
      ids.push(key.replace("pitchLog_", ""));
    }
  }
  ids.sort((a,b) => {
    const na = parseInt(a.split("_")[1]);
    const nb = parseInt(b.split("_")[1]);
    return na - nb;
  });
  return ids;
}

function getAllGameIds() {
  const ids = getStoredGameIds();
  if (!ids.includes(currentGameId)) ids.push(currentGameId);
  ids.sort((a,b) => {
    const na = parseInt(a.split("_")[1]);
    const nb = parseInt(b.split("_")[1]);
    return na - nb;
  });
  return ids;
}

function populateGameSelect() {
  const select = document.getElementById("gameSelect");
  select.innerHTML = "";
  const ids = getAllGameIds();
  ids.forEach(id => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = id;
    if (id === currentGameId) opt.selected = true;
    select.appendChild(opt);
  });
}

function getBackupPayload() {
  const games = {};
  getStoredGameIds().forEach(id => {
    const raw = localStorage.getItem("pitchLog_" + id);
    if (raw) {
      try {
        games[id] = JSON.parse(raw);
      } catch (error) {
        games[id] = [];
      }
    }
  });

  return {
    version: 1,
    exportedAt: new Date().toISOString(),
    currentGameId,
    games
  };
}

function saveGamesToFile() {
  const payload = getBackupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `pitchcaller-games-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();

  URL.revokeObjectURL(url);
}

function restoreGamesFromFile(file) {
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const payload = JSON.parse(event.target.result);
      if (!payload || !payload.games || typeof payload.games !== "object") {
        throw new Error("Backup file is missing game data.");
      }

      const gameIds = Object.keys(payload.games);
      if (gameIds.length === 0) {
        throw new Error("Backup file does not contain any saved games.");
      }

      gameIds.forEach(gameId => {
        const rows = Array.isArray(payload.games[gameId]) ? payload.games[gameId] : [];
        localStorage.setItem("pitchLog_" + gameId, JSON.stringify(rows));
      });

      currentGameId = payload.currentGameId && payload.games[payload.currentGameId]
        ? payload.currentGameId
        : gameIds[0];
      localStorage.setItem("currentGameId", currentGameId);

      populateGameSelect();
      loadLog(currentGameId);
      window.alert(`Restored ${gameIds.length} game(s) from ${file.name}.`);
    } catch (error) {
      window.alert("Unable to restore games: " + error.message);
    }
  };

  reader.readAsText(file);
}

function saveLog() {
  const rows = [...document.querySelectorAll("#logBody tr")].map(r =>
    [...r.children].map(c => c.textContent)
  );
  localStorage.setItem("pitchLog_" + currentGameId, JSON.stringify(rows));
  localStorage.setItem("currentGameId", currentGameId);
  populateGameSelect();
  updatePitchCounts();
}

function loadLog(gameId = null) {
  if (gameId) currentGameId = gameId;
  const saved = JSON.parse(localStorage.getItem("pitchLog_" + currentGameId) || "[]");
  const logBody = document.getElementById("logBody");
  logBody.innerHTML = "";
  saved.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row[0]}</td>
      <td>${row[1]}</td>
      <td>${row[2]}</td>
      <td>${row[3]}</td>
      <td>${row[4]}</td>
      <td>${row[5]}</td>
      <td>${row[6]}</td>
      <td>${row[7]}</td>
    `;
    logBody.appendChild(tr);
  });
  localStorage.setItem("currentGameId", currentGameId);
  populateGameSelect();
  updatePitchCounts();
}

function updatePitchCounts() {
  const countsBody = document.getElementById("pitchCountsBody");
  if (!countsBody) return;

  const counts = Object.fromEntries(pitchers.map(p => [p, 0]));
  const logRows = document.querySelectorAll("#logBody tr");

  logRows.forEach(row => {
    const pitcherCell = row.children[1];
    if (!pitcherCell) return;
    const pitcherName = pitcherCell.textContent;
    if (!counts[pitcherName]) counts[pitcherName] = 0;
    counts[pitcherName]++;
  });

  countsBody.innerHTML = "";
  Object.keys(counts).forEach(pitcher => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${pitcher}</td><td>${counts[pitcher]}</td>`;
    countsBody.appendChild(tr);
  });
}

// --- UI BUILDERS ---

function buildPitchers() {
  const div = document.getElementById("pitchers");
  pitchers.forEach(p => {
    const btn = document.createElement("button");
    btn.textContent = p;
    btn.dataset.name = p;
    btn.onclick = () => {
      currentPitcher = p;
      document.querySelectorAll("#pitchers button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      updatePitcherSummary();
      saveUiState();
    };
    if (p === currentPitcher) btn.classList.add("active");
    div.appendChild(btn);
  });
  updatePitcherSummary();
}

function updatePitcherSummary() {
  const summary = document.getElementById("pitcherSummary");
  const panelBody = document.getElementById("pitcherPanelBody");
  if (!summary || !panelBody) return;

  const isClosed = panelBody.style.display === "none";
  summary.textContent = isClosed ? `(${currentPitcher})` : "";
}

function initPitcherPanelToggle() {
  const toggleBtn = document.getElementById("togglePitcherPanelBtn");
  const panelBody = document.getElementById("pitcherPanelBody");

  toggleBtn.onclick = () => {
    const isHidden = panelBody.style.display === "none";
    panelBody.style.display = isHidden ? "block" : "none";
    toggleBtn.textContent = isHidden ? "Hide" : "Show";
    toggleBtn.setAttribute("aria-expanded", String(isHidden));
    updatePitcherSummary();
    saveUiState();
  };

  updatePitcherSummary();
}

function buildHands() {
  document.querySelectorAll(".handBtn").forEach(btn => {
    btn.onclick = () => {
      currentHand = btn.dataset.hand;
      document.querySelectorAll(".handBtn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      saveUiState();
    };
  });
  const activeHand = document.querySelector(`.handBtn[data-hand="${currentHand}"]`);
  if (activeHand) {
    document.querySelectorAll(".handBtn").forEach(b=>b.classList.remove("active"));
    activeHand.classList.add("active");
  }
}

function updateCountDisplay() {
  const countDisplay = document.getElementById("countDisplay");
  if (countDisplay) {
    countDisplay.textContent = `${balls}-${strikes}`;
  }
}

function resetCount() {
  balls = 0;
  strikes = 0;
  updateCountDisplay();
  saveUiState();
}

function newBatter() {
  let batterInput = document.getElementById("batterNum");
  let current = parseInt(batterInput.value || "1");
  batterInput.value = current + 1;
  saveUiState();
  resetCount();
}

function autoIncrementBatter() {
  const batterInput = document.getElementById("batterNum");
  const total = parseInt(document.getElementById("totalBatters").value || "9");

  let current = parseInt(batterInput.value || "1");
  current++;

  if (current > total) current = 1;

  batterInput.value = current;
  saveUiState();
  resetCount();
}

function buildPitchTypes() {
  const div = document.getElementById("pitchTypes");
  Object.keys(pitchMap).forEach(code => {
    const btn = document.createElement("button");
    btn.textContent = code;
    btn.onclick = () => {
      selectedPitchType = code;
      selectedNumber = null;
      document.querySelectorAll("#pitchTypes button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      buildPitchNumbers(code);
      saveUiState();
    };
    div.appendChild(btn);
  });

  if (selectedPitchType && pitchMap[selectedPitchType]) {
    const savedPitchBtn = Array.from(document.querySelectorAll("#pitchTypes button")).find(btn => btn.textContent === selectedPitchType);
    if (savedPitchBtn) {
      savedPitchBtn.classList.add("active");
      buildPitchNumbers(selectedPitchType);
    }
  }
}

function resetPitchNumbers() {
  const div = document.getElementById("pitchNumbers");
  div.innerHTML = "";
  selectedNumber = null;
}

function buildPitchNumbers(code) {
  const div = document.getElementById("pitchNumbers");
  div.innerHTML = "";
  pitchMap[code].forEach(num => {
    const btn = document.createElement("button");
    btn.textContent = num;
    btn.onclick = () => {
      selectedNumber = num;
      document.querySelectorAll("#pitchNumbers button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      saveUiState();
    };
    if (selectedNumber === num) {
      btn.classList.add("active");
    }
    div.appendChild(btn);
  });
}

function buildResults() {
  const div = document.getElementById("results");
  results.forEach(r => {
    const btn = document.createElement("button");
    btn.textContent = r;
    btn.onclick = () => {
      document.querySelectorAll("#results button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      handleResult(r);
    };
    div.appendChild(btn);
  });
}

function buildHitLocations() {
  const div = document.getElementById("hitLocations");
  hitLocations.forEach(h => {
    const btn = document.createElement("button");
    btn.textContent = h;
    btn.onclick = () => {
      window._pendingHitLocation = h;
      document.querySelectorAll("#hitLocations button").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll("#hitOutcomes button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("hitOutcomesPanel").style.display = "block";
    };
    div.appendChild(btn);
  });
}

function buildHitDetails() {
  const div = document.getElementById("hitDetails");
  hitDetails.forEach(h => {
    const btn = document.createElement("button");
    btn.textContent = h;
    btn.onclick = () => {
      window._pendingHitDetail = h;
      document.querySelectorAll("#hitDetails button").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll("#hitLocations button").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll("#hitOutcomes button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("hitLocationsPanel").style.display = "block";
    };
    div.appendChild(btn);
  });
}

function buildHitOutcomes() {
  const div = document.getElementById("hitOutcomes");
  hitOutcomes.forEach(h => {
    const btn = document.createElement("button");
    btn.textContent = h;
    btn.onclick = () => {
      document.querySelectorAll("#hitOutcomes button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      LogInPlayOutcome(h);
    };
    div.appendChild(btn);
  });
}

// --- LOGGING ---

function handleResult(result) {
  if (result === "Ball") {
    if (balls < 3) balls++;
    else autoIncrementBatter(); // walk
  }
  else if (result === "Strike Looking" || result === "Strike Swinging" || result === "Foul") {
    if (strikes < 2) strikes++;
    else autoIncrementBatter(); // strikeout
  }
  else if (result === "In Play") {
    document.getElementById("hitResultsPanel").style.display = "block";
    window._pendingResult = result;
    updateCountDisplay();
    saveUiState();
    return;
  }
  else if (result === "HBP") {
    autoIncrementBatter();
  }

  updateCountDisplay();
  saveUiState();

  if (result !== "In Play") {
    document.getElementById("hitResultsPanel").style.display = "none";
    document.getElementById("hitOutcomesPanel").style.display = "none";
    document.getElementById("hitLocationsPanel").style.display = "none";
    finalizeLog(null, result);
  }
}

function LogInPlayOutcome(outcome) {
  const hitLocation = window._pendingHitLocation;
  const hitDetail = window._pendingHitDetail; 
  const result = window._pendingResult;
  const overrideResult = result + " - " + hitDetail + "- " + hitLocation + " - " + outcome;
  finalizeLog(null , overrideResult);
}

function finalizeLog(hitLoc, overrideResult) {
  const batterNum = document.getElementById("batterNum").value || "";
  const result = overrideResult || window._pendingResult || "";
  const row = document.createElement("tr");
  const now = new Date().toLocaleTimeString();

  row.innerHTML = `
    <td>${now}</td>
    <td>${currentPitcher}</td>
    <td>${batterNum}</td>
    <td>${currentHand}</td>
    <td>${balls}-${strikes}</td>
    <td>${selectedPitchType || ""}</td>
    <td>${selectedNumber || ""}</td>
    <td>${result}</td>
  `;
  document.getElementById("logBody").appendChild(row);

  if (result === "In Play") autoIncrementBatter();

  //Reset form for next pitch
  //Hide results panels
  document.getElementById("hitOutcomesPanel").style.display = "none";
  document.getElementById("hitLocationsPanel").style.display = "none";
  document.getElementById("hitResultsPanel").style.display = "none";
  //Reset active buttons
  document.querySelectorAll("#hitDetails button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#hitLocations button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#hitOutcomes button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#results button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#pitchTypes button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#pitchNumbers button").forEach(b=>b.classList.remove("active"));
  selectedPitchType = null;
  selectedNumber = null;
  resetPitchNumbers();
  
  window._pendingResult = null;
  window._pendingHitLocation = null;
  window._pendingHitDetail = null;

  saveUiState();
  saveLog();
}

function undoLastPitch() {
  const logBody = document.getElementById("logBody");
  const rows = logBody.getElementsByTagName("tr");

  if (rows.length === 0) return;

  const lastRow = rows[rows.length - 1];
  logBody.removeChild(lastRow);

  const restoredCount = lastRow.children[4].textContent.split("-");
  balls = parseInt(restoredCount[0]);
  strikes = parseInt(restoredCount[1]);
  updateCountDisplay();

  document.getElementById("hitLocationsPanel").style.display = "none";
  document.getElementById("hitOutcomesPanel").style.display = "none";
  document.getElementById("hitResultsPanel").style.display = "none";
  window._pendingResult = null;

  saveUiState();
  saveLog();
}

// --- CSV EXPORT ---

function exportCSV() {
  const rows = [...document.querySelectorAll("#logBody tr")].map(r =>
    [...r.children].map(c => c.textContent)
  );

  let csv = "Time,Pitcher,Batter,Hand,Count,Pitch,#,Result\n";
  rows.forEach(r => {
    csv += r.join(",") + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = currentGameId + ".csv";
  a.click();

  URL.revokeObjectURL(url);
}

// --- NEW GAME ---

function newGame() {
  let num = parseInt(currentGameId.split("_")[1]);
  num++;
  currentGameId = "game_" + num;

  localStorage.setItem("currentGameId", currentGameId);

  document.getElementById("logBody").innerHTML = "";
  resetCount();
  document.getElementById("batterNum").value = 1;

  saveLog();
}

function deleteGame() {
  const selectedGameId = document.getElementById("gameSelect").value || currentGameId;
  const confirmed = window.confirm(`Delete ${selectedGameId} and all of its data? This cannot be undone.`);
  if (!confirmed) return;

  const typedConfirm = window.prompt(`Type DELETE to permanently remove ${selectedGameId}:`, "");
  if (typedConfirm !== "DELETE") {
    window.alert("Delete canceled. You must type DELETE exactly to confirm.");
    return;
  }

  localStorage.removeItem("pitchLog_" + selectedGameId);

  const remainingIds = getStoredGameIds();
  if (remainingIds.length === 0) {
    const deletedNum = parseInt(selectedGameId.split("_")[1], 10);
    const nextNum = Number.isFinite(deletedNum) ? deletedNum + 1 : 1;
    currentGameId = "game_" + nextNum;

    localStorage.setItem("currentGameId", currentGameId);
    document.getElementById("logBody").innerHTML = "";
    resetCount();
    document.getElementById("batterNum").value = 1;
    saveLog();
    return;
  }

  if (selectedGameId === currentGameId) {
    currentGameId = remainingIds[0];
  }

  loadLog(currentGameId);
}

function initGamesPanelToggle() {
  const toggleBtn = document.getElementById("toggleGamesPanelBtn");
  const panelBody = document.getElementById("gamesPanelBody");

  toggleBtn.onclick = () => {
    const isHidden = panelBody.style.display === "none";
    panelBody.style.display = isHidden ? "block" : "none";
    toggleBtn.textContent = isHidden ? "Hide" : "Show";
    toggleBtn.setAttribute("aria-expanded", String(isHidden));
    saveUiState();
  };
}

function initLogPanelToggle() {
  const toggleBtn = document.getElementById("toggleLogPanelBtn");
  const panelBody = document.getElementById("logPanelBody");

  toggleBtn.onclick = () => {
    const isHidden = panelBody.style.display === "none";
    panelBody.style.display = isHidden ? "block" : "none";
    toggleBtn.textContent = isHidden ? "Hide" : "Show";
    toggleBtn.setAttribute("aria-expanded", String(isHidden));
    saveUiState();
  };
}

buildPitchers();
buildHands();

buildPitchTypes();
buildResults();

buildHitOutcomes();
initPitcherPanelToggle();

loadLog(currentGameId);

};

};

document.getElementById("totalBatters").addEventListener("input", saveUiState);
