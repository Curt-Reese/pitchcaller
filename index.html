<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Liberty Pitch Calling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 8px; }
    .top-row { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .top-row h2 { margin: 0; flex: 1; min-width: 220px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .panel { border: 1px solid #ccc; padding: 6px 8px; border-radius: 6px; flex: 1; min-width: 220px; }
    .games-panel { flex: 0 1 320px; }
    .pitcher-panel { flex: 0 1 280px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .panel-header h3 { margin: 0; }
    .panel h3 {
      margin: 0 0 4px;
      font-size: 15px;
      line-height: 1.2;
    }
    .panel-summary { font-size: 12px; color: #555; margin-left: 6px; }
    .collapse-toggle { padding: 4px 8px; font-size: 12px; }
    .collapsible-content { margin-top: 6px; }

    label {
      display: inline-block;
      font-size: 16px;
      line-height: 1.3;
      margin-bottom: 4px;
      font-weight: 600;
      color: #1f2937;
    }

    .batter-grid {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 0;
      min-height: 0;
      overflow: hidden;
    }

    .batter-grid label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.2;
      flex: 0 1 auto;
    }

    .count-stack {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 30px;
      width: 100%;
      margin-bottom: 4px;
    }

    button {
      padding: 7px 10px;
      margin: 2px;
      border-radius: 6px;
      border: 2px solid #666;
      background:#f5f5f5;
      font-size: 16px;
      font-weight: 600;
      min-height: 38px;
      line-height: 1.2;
      cursor: pointer;
    }
    #pitchTypes, #results {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: flex-start;
    }
    #pitchTypes {
      display: flex;
      flex-wrap: wrap;
      flex-direction: row;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 0;
      gap: 2px;
    }
    #pitchNumbers {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      padding: 8px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef5ff 100%);
      border: 1px solid #d9e2f1;
      border-radius: 8px;
    }
    .pitch-number-display {
      font-size: clamp(34px, 6vw, 72px);
      font-weight: 800;
      line-height: 1;
      color: #111827;
      text-align: center;
      margin-top: 8px;
    }
    .pitch-grid-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 8px auto 4px;
      width: fit-content;
      max-width: 100%;
    }
    .pitch-grid-wrap.rh .hand-orientation-indicator {
      order: -1;
      margin-right: 0;
    }
    .pitch-grid-wrap.lh .hand-orientation-indicator {
      order: 1;
      margin-left: 0;
    }
    .hand-orientation-indicator {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid #8ec18f;
      background: #ebf8ed;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
      flex-shrink: 0;
      overflow: hidden;
    }
    .hand-orientation-indicator i {
      font-size: 16px;
      color: #1f2937;
    }
    .pitch-grid-wrap.lh .hand-orientation-indicator i {
      transform: scaleX(-1);
    }
    .pitch-location-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(34px, 1fr));
      gap: 5px;
      width: min(100%, 180px);
      aspect-ratio: 1;
      padding: 8px;
      border-radius: 10px;
      background: #f3faf3;
      border: 1px solid #9ec69d;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 2px 5px rgba(16, 60, 39, 0.08);
      overflow: hidden;
      flex: 0 0 auto;
      margin: 0 auto;
    }
    .pitch-location-grid button {
      position: relative;
      z-index: 1;
      min-width: 0;
      width: 100%;
      font-size: 12px;
      min-height: 30px;
      padding: 4px 3px;
      border: 2px solid #7c8aa5;
      background: rgba(255,255,255,0.75);
      color: #1f2937;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .pitch-location-grid button:hover {
      background: #dfeeff;
      border-color: #4769a9;
    }
    .pitch-location-grid button.active {
      background: #007bff;
      border-color: #0056b3;
      color: #fff;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25), 0 0 0 2px rgba(0, 123, 255, 0.2);
      transform: translateY(-1px);
    }
    #pitchTypes button {
      flex: 0 0 auto;
      min-height: 24px;
      min-width: 34px;
      padding: 3px 5px;
      font-size: 11px;
      margin: 1px;
      line-height: 1.1;
      width: auto;
    }
    #results button,
    #hitDetails button, #hitLocations button, #hitOutcomes button {
      min-height: 30px;
      padding: 4px 7px;
      font-size: 13px;
      margin: 1px;
    }
    button.active { background:#007bff; color:#fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { border: 1px solid #ccc; padding: 4px; text-align: center; }
    .small { font-size: 12px; }
    .counts-table { margin-top: 0; }

    input, select {
      border: 2px solid #6c757d;
      border-radius: 6px;
      background: #fff;
      padding: 4px 6px;
      font-size: 13px;
      line-height: 1.2;
      min-height: 28px;
      box-sizing: border-box;
    }

    .handBtn,
    #newBatterBtn,
    #undoBtn {
      min-height: 28px;
      padding: 4px 8px;
      font-size: 13px;
      line-height: 1.1;
    }

    #countDisplay {
      font-size: 20px;
      font-weight: 700;
      min-width: 120px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .count-pill {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 800;
    }

    .count-pill.balls {
      color: #0b57d0;
      background: rgba(11, 87, 208, 0.12);
    }

    .count-pill.strikes {
      color: #c62828;
      background: rgba(198, 40, 40, 0.12);
    }

    input:focus, select:focus {
      outline: none;
      border-color: #0056b3;
      box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.18);
    }

    @media (min-width: 768px) and (max-width: 1024px) {
      body {
        font-size: 16px;
        padding: 6px 12px 16px;
      }

      .top-row {
        gap: 12px;
        margin-bottom: 12px;
      }

      .top-row h2 {
        font-size: 2.1rem;
      }

      .row {
        gap: 8px;
        margin-bottom: 8px;
      }

      .panel {
        padding: 8px 10px;
        border-radius: 8px;
      }

      .panel-header h3 {
        font-size: 1.3rem;
      }

      label {
        font-size: 18px;
      }

      button {
        padding: 10px 14px;
        min-height: 46px;
        border-width: 3px;
        font-size: 18px;
      }

      input, select {
        border-width: 3px;
        padding: 10px 12px;
        min-height: 42px;
        font-size: 18px;
      }
    }

    @media (orientation: landscape) and (min-width: 768px) {
      body {
        max-width: 1400px;
        margin: 8px auto;
      }

      .top-row,
      .row {
        align-items: stretch;
      }

      .panel {
        min-width: 240px;
        padding: 6px 8px;
      }

      .games-panel {
        flex: 1 1 420px;
      }

      .pitcher-panel {
        flex: 1 1 360px;
      }

      .row {
        flex-wrap: nowrap;
        gap: 8px;
      }

      .row > .panel {
        flex: 1 1 0;
        min-width: 0;
      }

      .panel h3 {
        margin-top: 0;
        margin-bottom: 6px;
      }

      .panel > h3 + label,
      .panel > label {
        margin-top: 0;
      }

      #countDisplay {
        font-size: 18px !important;
        margin: 4px 0 8px;
      }

      .batter-grid {
        gap: 6px 10px;
        margin-bottom: 4px;
      }

      .count-stack {
        min-height: 48px;
        gap: 12px;
      }

      #countDisplay {
        font-size: 22px !important;
      }

      #newBatterBtn,
      #undoBtn {
        margin-top: 4px;
      }

      #pitchTypes button,
      #pitchNumbers button,
      #results button {
        min-height: 30px;
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="top-row">
  <h2>Liberty Pitch Calling</h2>

  <div class="panel pitcher-panel">
    <div class="panel-header">
      <h3>Pitcher <span id="pitcherSummary" class="panel-summary"></span></h3>
      <button id="togglePitcherPanelBtn" class="collapse-toggle" type="button" aria-expanded="false" aria-controls="pitcherPanelBody">
        Show
      </button>
    </div>
    <div id="pitcherPanelBody" class="collapsible-content" style="display:none;">
      <div id="pitchers"></div>
    </div>
  </div>

  <div class="panel games-panel">
    <div class="panel-header">
      <h3>Games</h3>
      <button id="toggleGamesPanelBtn" class="collapse-toggle" type="button" aria-expanded="false" aria-controls="gamesPanelBody">
        Show
      </button>
    </div>
    <div id="gamesPanelBody" class="collapsible-content" style="display:none;">
      <label>Load Game:
        <select id="gameSelect"></select>
      </label>
      <div id="gameNameControls" style="display:none; margin-top:8px;">
        <label for="gameNameInput" style="display:block; margin-bottom:4px;">Game Name:</label>
        <input id="gameNameInput" type="text" maxlength="80" placeholder="My game" style="width:200px;">
      </div>
      <div id="newGameControls" style="display:none; margin-top:8px;">
        <button id="addNewGameBtn" type="button" style="background:#28a745; color:white; margin-right:6px;">
          Add New Game
        </button>
        <button id="cancelNewGameBtn" type="button" style="background:#6c757d; color:white;">
          Cancel
        </button>
      </div>
      <div style="margin-top:8px;">
        <button id="newGameBtn" type="button" style="background:#6f42c1; color:white; margin-right:6px;">
          New Game
        </button>
        <button id="renameCurrentGameBtn" type="button" style="background:#17a2b8; color:white;">
          Rename Current Game
        </button>
      </div>
      <div>
        <button id="clearBatterProfilesBtn" style="margin-top:6px; background:#fd7e14; color:white;">
          Clear Batter Profiles
        </button>
      </div>
      <div>
        <button id="exportCsvBtn" style="margin-top:6px; background:#17a2b8; color:white;">
          Export CSV
        </button>
      </div>
      <div>
        <button id="saveGamesBtn" style="margin-top:6px; background:#28a745; color:white;">
          Save Games to File
        </button>
      </div>
      <div>
        <button id="restoreGamesBtn" style="margin-top:6px; background:#ffc107; color:#000;">
          Restore Games from File
        </button>
        <input id="restoreGamesInput" type="file" accept="application/json,.json" style="display:none;" />
      </div>

        <button id="deleteGameBtn" style="margin-top:6px; background:#dc3545; color:white;">
          Delete Game
        </button>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="panel" style="min-width: 0;">
    <div class="batter-grid">
      <label>Batter #:
        <input type="number" id="batterNum" min="1" max="20" value="1" style="width:58px;">
      </label>
      <label>Name:
        <input type="text" id="batterName" placeholder="Optional" style="width:150px;">
      </label>
      <label>#:
        <input type="number" id="batterJersey" min="0" max="99" placeholder="Optional" style="width:62px;">
      </label>
      <label>TB:
        <input type="number" id="totalBatters" min="1" max="20" value="9" style="width:52px;">
      </label>
      <button data-hand="RH" class="handBtn active">RH</button>
      <button data-hand="LH" class="handBtn">LH</button>
      <button id="newBatterBtn" style="background:#28a745; color:white;">
        New Batter
      </button>
    </div>
    <div class="count-stack">
      <div id="countDisplay" aria-live="polite">Balls: <span class="count-pill balls">0/4</span> &nbsp; Strikes: <span class="count-pill strikes">0/3</span></div>
      <button id="undoBtn" style="background:#dc3545; color:white;">
        Undo Last Pitch
      </button>
    </div>
  </div>
</div>

<div class="row">
  <div class="panel">
    <h3>Pitch Type</h3>
    <div id="pitchTypes"></div>
  </div>

  <div class="panel">
    <h3>Selected Number</h3>
    <div id="pitchNumbers"></div>
  </div>

  <div class="panel">
    <h3>Result</h3>
    <div id="results"></div>

    <div id="hitResultsPanel" style="margin-top:6px; display:none;">
      <h4 class="small">Hit Details</h4>
      <div id="hitDetails"></div>
      <div id="hitLocationsPanel" style="margin-top:6px; display:none;"></div>
        <h4 class="small">Hit Location</h4>
        <div id="hitLocations"></div>
      </div>
      <div id="hitOutcomesPanel" style="margin-top:6px; display:none;">
        <h4 class="small">Hit Outcome</h4>
        <div id="hitOutcomes"></div>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <h3>Log</h3>
    <button id="toggleLogPanelBtn" class="collapse-toggle" type="button" aria-expanded="false" aria-controls="logPanelBody">
      Show
    </button>
  </div>
  <div id="logPanelBody" class="collapsible-content" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>Time</th><th>Pitcher</th><th>Batter</th><th>Hand</th>
          <th>Count</th><th>Pitch</th><th>#</th><th>Result</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
</div>

<div class="row">
  <div class="panel">
    <h3>Pitch Counts (Current Game)</h3>
    <table class="counts-table">
      <thead>
        <tr><th>Pitcher</th><th>Total Pitches</th></tr>
      </thead>
      <tbody id="pitchCountsBody"></tbody>
    </table>
  </div>
</div>
<div class="footer">
  <p>&copy; 2026 PitchCaller v1.1</p>
</div>

<script>
// --- GAME ID SUPPORT ---
let currentGameId = localStorage.getItem("currentGameId") || "game_1";

function getGameName(gameId, fallback = null) {
  const saved = localStorage.getItem("gameName_" + gameId);
  if (saved && saved.trim()) return saved.trim();
  return fallback !== null ? fallback : gameId;
}

function setGameName(gameId, name) {
  const cleaned = (name || "").trim();
  if (!cleaned) {
    localStorage.removeItem("gameName_" + gameId);
    return;
  }
  localStorage.setItem("gameName_" + gameId, cleaned);
}

function syncGameNameInput() {
  const input = document.getElementById("gameNameInput");
  const controls = document.getElementById("gameNameControls");
  if (!input) return;

  if (controls && controls.style.display !== "none" && input.dataset.mode === "current") {
    input.value = getGameName(currentGameId, currentGameId);
  }
}

function showGameNameInput(mode) {
  const input = document.getElementById("gameNameInput");
  const controls = document.getElementById("gameNameControls");
  const newGameControls = document.getElementById("newGameControls");
  if (!input || !controls || !newGameControls) return;

  input.dataset.mode = mode;
  controls.style.display = "block";
  newGameControls.style.display = mode === "new" ? "block" : "none";

  if (mode === "current") {
    input.value = getGameName(currentGameId, currentGameId);
    input.placeholder = "Current game name";
  } else {
    input.value = "";
    input.placeholder = "My new game";
  }

  input.focus();
}

function hideGameNameInput() {
  const input = document.getElementById("gameNameInput");
  const controls = document.getElementById("gameNameControls");
  const newGameControls = document.getElementById("newGameControls");
  if (!input || !controls || !newGameControls) return;

  controls.style.display = "none";
  newGameControls.style.display = "none";
  input.value = "";
  delete input.dataset.mode;
  input.placeholder = "My game";
}

function saveCurrentGameNameFromInput() {
  const input = document.getElementById("gameNameInput");
  if (!input || input.dataset.mode !== "current") return;

  const name = (input.value || "").trim();
  if (!name) {
    input.value = getGameName(currentGameId, currentGameId);
    return;
  }

  setGameName(currentGameId, name);
  populateGameSelect();
  hideGameNameInput();
}

// --- CONFIG ---

window.SUPABASE_CONFIG = window.SUPABASE_CONFIG || {
  url: "https://YOUR_PROJECT_ID.supabase.co",
  key: "YOUR_SUPABASE_ANON_KEY",
  table: "pitchcaller_games"
};

const pitchers = ["Miranda", "Nikki", "Alex", "Harper", "Kennedy"];

function getSupabaseClient() {
  const config = window.SUPABASE_CONFIG || {};
  const url = (config.url || "").trim();
  const key = (config.key || "").trim();

  if (!window.supabase || !url || !key || url.includes("YOUR_PROJECT_ID") || key.includes("YOUR_")) {
    return null;
  }

  return window.supabase.createClient(url, key);
}

function getLocalRowsForGame(gameId) {
  try {
    return JSON.parse(localStorage.getItem("pitchLog_" + gameId) || "[]");
  } catch (error) {
    return [];
  }
}

async function loadGameRowsFromSupabase(gameId) {
  const client = getSupabaseClient();
  if (!client) {
    return getLocalRowsForGame(gameId);
  }

  const table = (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.table) || "pitchcaller_games";
  const { data, error } = await client
    .from(table)
    .select("rows, game_name")
    .eq("game_id", gameId)
    .maybeSingle();

  if (error) {
    console.warn("Supabase load failed:", error.message);
    return getLocalRowsForGame(gameId);
  }

  if (data && data.game_name) {
    setGameName(gameId, data.game_name);
  }

  if (!data || !data.rows) {
    return getLocalRowsForGame(gameId);
  }

  try {
    return JSON.parse(data.rows);
  } catch (error) {
    return [];
  }
}

async function saveGameRowsToSupabase(gameId, rows) {
  const client = getSupabaseClient();
  if (!client) {
    return false;
  }

  const table = (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.table) || "pitchcaller_games";
  const { error } = await client
    .from(table)
    .upsert({
      game_id: gameId,
      game_name: getGameName(gameId, gameId),
      rows: JSON.stringify(rows),
      updated_at: new Date().toISOString()
    }, { onConflict: "game_id" });

  if (error) {
    console.warn("Supabase save failed:", error.message);
    return false;
  }

  return true;
}

async function deleteGameRowsFromSupabase(gameId) {
  const client = getSupabaseClient();
  if (!client) {
    return false;
  }

  const table = (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.table) || "pitchcaller_games";
  const { error } = await client
    .from(table)
    .delete()
    .eq("game_id", gameId);

  if (error) {
    console.warn("Supabase delete failed:", error.message);
    return false;
  }

  return true;
}

const pitchMap = {
  FDO: ["124","235","342","412","425","442","444","515","554"],
  FDI: ["043","121","133","153","213","215","345","422","435"],
  FUI: ["131","225","233","414","545"],
  FUO: ["041","144","451","455","544"],
  FU:  ["311","414","432","443","554"],
  FD:  ["124","144","242","441","532"],
  FI:  ["112","152","211","255","313"],
  FO:  ["011","023","055","145","245"],
  F:   ["045","134","222","223","341"],
  CDO: ["025","111","155","532","533","552"],
  CDI: ["132","151","324","524","534","551"],
  CUO: ["015","224","243","253","323","543"],
  CUI: ["212","244","322","331","445","514"],
  CU:  ["114","211","314","332","421"],
  CD:  ["051","121","213","252","445"],
  CI:  ["032","114","123","254","314","334","441","521","555"],
  CO:  ["234","251","312","351","415","512","535","542","553"],
  C:   ["013","053","113","332","335","355","452","525"],
  D:   ["013","053","113","332","335","355","452","525"],
  DI:  ["142","241","242","352","423","443","453","541"],
  DO:  ["034","035","143","154","232","325","511","513"],
  CRV: ["031","033","051","135","221","333","421","424"],
  BDC: ["022","052","115","122","344","433"],
  SCW: ["012","141","231","311","354","434"],
  R:   ["021","042","125","315","343"],
  RI:  ["024","214","321","353","431"],
  RO:  ["044","252","411","454","522"]
};

const pitchFamilyOptions = {
  RH: {
    Fastball: ["FUI", "FU", "FUO", "FI", "F", "FO", "FDI", "FD", "FDO"],
    Changeup: ["CUI", "CU", "CUO", "CI", "C", "CO", "CDI", "CD", "CDO"],
    Drop: ["DI", "D", "DO"],
    Rise: ["RI", "R", "RO"]
  },
  LH: {
    Fastball: ["FUO", "FU", "FUI", "FO", "F", "FI", "FDO", "FD", "FDI"],
    Changeup: ["CUO", "CU", "CUI", "CO", "C", "CI", "CDO", "CD", "CDI"],
    Drop: ["DO", "D", "DI"],
    Rise: ["RO", "R", "RI"]
  }
};

function getStoredGameIds() {
  const ids = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith("pitchLog_")) {
      ids.push(key.replace("pitchLog_", ""));
    }
  }
  ids.sort((a,b) => {
    const na = parseInt(a.split("_")[1]);
    const nb = parseInt(b.split("_")[1]);
    return na - nb;
  });
  return ids;
}

function getAllGameIds() {
  const ids = getStoredGameIds();
  if (!ids.includes(currentGameId)) ids.push(currentGameId);
  ids.sort((a,b) => {
    const na = parseInt(a.split("_")[1]);
    const nb = parseInt(b.split("_")[1]);
    return na - nb;
  });
  return ids;
}

function getBackupPayload() {
  const games = {};
  const gameNames = {};
  getStoredGameIds().forEach(id => {
    const raw = localStorage.getItem("pitchLog_" + id);
    if (raw) {
      try {
        games[id] = JSON.parse(raw);
      } catch (error) {
        games[id] = [];
      }
    }

    const name = localStorage.getItem("gameName_" + id);
    if (name) {
      gameNames[id] = name;
    }
  });

  return {
    version: 2,
    exportedAt: new Date().toISOString(),
    currentGameId,
    games,
    gameNames
  };
}

function saveGamesToFile() {
  const payload = getBackupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `pitchcaller-games-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();

  URL.revokeObjectURL(url);
}

function restoreGamesFromFile(file) {
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const payload = JSON.parse(event.target.result);
      if (!payload || !payload.games || typeof payload.games !== "object") {
        throw new Error("Backup file is missing game data.");
      }

      const gameIds = Object.keys(payload.games);
      if (gameIds.length === 0) {
        throw new Error("Backup file does not contain any saved games.");
      }

      gameIds.forEach(gameId => {
        const rows = Array.isArray(payload.games[gameId]) ? payload.games[gameId] : [];
        localStorage.setItem("pitchLog_" + gameId, JSON.stringify(rows));
        const restoredName = payload.gameNames && payload.gameNames[gameId];
        if (restoredName) {
          localStorage.setItem("gameName_" + gameId, restoredName);
        } else {
          localStorage.removeItem("gameName_" + gameId);
        }
      });

      currentGameId = payload.currentGameId && payload.games[payload.currentGameId]
        ? payload.currentGameId
        : gameIds[0];
      localStorage.setItem("currentGameId", currentGameId);

      populateGameSelect();
      syncGameNameInput();
      loadLog(currentGameId);
      window.alert(`Restored ${gameIds.length} game(s) from ${file.name}.`);
    } catch (error) {
      window.alert("Unable to restore games: " + error.message);
    }
  };

  reader.readAsText(file);
}

function buildPitchNumbers(code) {
  const div = document.getElementById("pitchNumbers");
  const possiblePitchCodes = getPitchLocationOptions(code);
  div.innerHTML = "";

  const pitchTypesPanel = document.getElementById("pitchTypes");
  const existingWrap = pitchTypesPanel.querySelector(".pitch-grid-wrap");
  if (existingWrap) existingWrap.remove();

  if (!possiblePitchCodes.length) {
    selectedPitchFamily = code;
    selectedPitchType = code;
    selectedNumber = null;
    return;
  }

  if (possiblePitchCodes.length === 1) {
    selectedPitchFamily = code;
    selectedPitchType = possiblePitchCodes[0];
    selectedNumber = pickRandomPitchNumber(selectedPitchType);
    const display = document.createElement("div");
    display.className = "pitch-number-display";
    display.textContent = selectedNumber;
    div.appendChild(display);
    saveUiState();
    return;
  }

  const wrap = document.createElement("div");
  wrap.className = `pitch-grid-wrap ${currentHand === "LH" ? "lh" : "rh"}`;

  const handBadge = document.createElement("div");

  const grid = document.createElement("div");

  const activePitch = selectedPitchType && possiblePitchCodes.includes(selectedPitchType) ? selectedPitchType : possiblePitchCodes[0];
  selectedPitchFamily = code;
  selectedPitchType = activePitch;

  possiblePitchCodes.forEach(pitchCode => {
    const btn = document.createElement("button");
    btn.textContent = pitchCode;
    btn.onclick = () => {
      selectedPitchFamily = code;
      selectedPitchType = pitchCode;
      selectedNumber = pickRandomPitchNumber(pitchCode);
      document.querySelectorAll("#pitchTypes .pitch-location-grid button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const display = div.querySelector(".pitch-number-display");
      if (display) {

      } else {

        newDisplay.className = "pitch-number-display";

        div.appendChild(newDisplay);

      saveUiState();
    };

    if (selectedPitchType === pitchCode) {
      btn.classList.add("active");
    }

    grid.appendChild(btn);
  });

  wrap.appendChild(grid);
  pitchTypesPanel.appendChild(wrap);

  selectedNumber = pickRandomPitchNumber(selectedPitchType);
  const display = document.createElement("div");
  display.className = "pitch-number-display";
  display.textContent = selectedNumber;
  div.appendChild(display);
  saveUiState();

// --- LOGGING ---

function handleResult(result) {
  if (result === "Ball") {
    if (balls < 3) {
      // finalizeLog before incrementing balls so the count at time of pitch is recorded.
      finalizeLog(null, result);
      balls++;
    }
    else {
      // finalizeLog before moving to next batter
      finalizeLog(null, result);
      autoIncrementBatter(); // walk
    }
  }
  else if (result === "Strike Looking" || result === "Strike Swinging" || result === "Foul") {
    if (strikes < 2) {
      // finalizeLog before incrementing strikes so the count at time of pitch is record.
      finalizeLog(null, result);
      strikes++;
    }
    else {
      // finalizeLog before moving to next batter
      finalizeLog(null, result);
      // if foul, stays at 2 strikes and does not move to next batter.
      if (result !== "Foul") {
      autoIncrementBatter(); // strikeout
      }
    }
  }
  else if (result === "In Play") {
    document.getElementById("hitResultsPanel").style.display = "block";
    window._pendingResult = result;
    updateCountDisplay();
    saveUiState();
    return;
  }
  else if (result === "HBP") {
    finalizeLog(null, result); // finalizeLog before moving to next batter for HBP
    autoIncrementBatter();
  }

  updateCountDisplay();
  saveUiState();

  if (result !== "In Play") {
    document.getElementById("hitResultsPanel").style.display = "none";
    document.getElementById("hitOutcomesPanel").style.display = "none";
    document.getElementById("hitLocationsPanel").style.display = "none";
    //finalizeLog(null, result);
  }
}

function LogInPlayOutcome(outcome) {
  const hitLocation = window._pendingHitLocation;
  const hitDetail = window._pendingHitDetail; 
  const result = window._pendingResult;
  const overrideResult = result + " - " + hitDetail + "- " + hitLocation + " - " + outcome;
  finalizeLog(null , overrideResult);
  autoIncrementBatter();
}

function finalizeLog(hitLoc, overrideResult) {
  const batterDisplay = getBatterDisplayName();
  const result = overrideResult || window._pendingResult || "";
  const row = document.createElement("tr");
  const now = new Date().toLocaleTimeString();

  row.innerHTML = `
    <td>${now}</td>
    <td>${currentPitcher}</td>
    <td>${batterDisplay}</td>
    <td>${currentHand}</td>
    <td>${balls}-${strikes}</td>
    <td>${selectedPitchType || ""}</td>
    <td>${selectedNumber || ""}</td>
    <td>${result}</td>
  `;
  document.getElementById("logBody").appendChild(row);

  if (result === "In Play") autoIncrementBatter();

  //Reset form for next pitch
  //Hide results panels
  document.getElementById("hitOutcomesPanel").style.display = "none";
  document.getElementById("hitLocationsPanel").style.display = "none";
  document.getElementById("hitResultsPanel").style.display = "none";
  //Reset active buttons
  document.querySelectorAll("#hitDetails button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#hitLocations button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#hitOutcomes button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#results button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#pitchTypes button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("#pitchNumbers button").forEach(b=>b.classList.remove("active"));
  selectedPitchType = null;
  selectedNumber = null;
  resetPitchNumbers();
  
  window._pendingResult = null;
  window._pendingHitLocation = null;
  window._pendingHitDetail = null;

  saveUiState();
  saveLog();
}

function undoLastPitch() {
  const logBody = document.getElementById("logBody");
  const rows = logBody.getElementsByTagName("tr");

  if (rows.length === 0) return;

  const lastRow = rows[rows.length - 1];
  logBody.removeChild(lastRow);

  const restoredCount = lastRow.children[4].textContent.split("-");
  balls = parseInt(restoredCount[0]);
  strikes = parseInt(restoredCount[1]);
  updateCountDisplay();

  document.getElementById("hitLocationsPanel").style.display = "none";
  document.getElementById("hitOutcomesPanel").style.display = "none";
  document.getElementById("hitResultsPanel").style.display = "none";
  window._pendingResult = null;

  saveUiState();
  saveLog();
}

// --- CSV EXPORT ---

function exportCSV() {
  const rows = [...document.querySelectorAll("#logBody tr")].map(r =>
    [...r.children].map(c => c.textContent)
  );

  let csv = "Time,Pitcher,Batter,Hand,Count,Pitch,#,Result\n";
  rows.forEach(r => {
    csv += r.join(",") + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = currentGameId + ".csv";
  a.click();

  URL.revokeObjectURL(url);
}

// --- NEW GAME ---

function clearBatterProfiles() {
  const confirmed = window.confirm("Clear all saved batter profiles for this app? This will reset batting names, jersey numbers, and hand settings for the current lineup.");
  if (!confirmed) return;

  localStorage.removeItem(BATTER_PROFILES_KEY);

  const batterInput = document.getElementById("batterNum");
  const batterNameInput = document.getElementById("batterName");
  const batterJerseyInput = document.getElementById("batterJersey");
  if (batterInput) batterInput.value = 1;
  if (batterNameInput) batterNameInput.value = "";
  if (batterJerseyInput) batterJerseyInput.value = "";

  currentHand = "RH";
  document.querySelectorAll(".handBtn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.hand === currentHand);
  });

  saveUiState();
}

function newGame() {
  const nameInput = document.getElementById("gameNameInput");
  if (!nameInput || nameInput.dataset.mode !== "new") {
    showGameNameInput("new");
    return;
  }

  const customName = (nameInput.value || "").trim();
  let num = parseInt(currentGameId.split("_")[1], 10);
  if (!Number.isFinite(num)) num = 0;
  num++;
  const previousGameId = currentGameId;
  currentGameId = "game_" + num;

  localStorage.setItem("currentGameId", currentGameId);
  const nextName = customName || `Game ${num}`;
  setGameName(currentGameId, nextName);

  localStorage.removeItem(BATTER_PROFILES_KEY);

  document.getElementById("logBody").innerHTML = "";
  resetCount();
  document.getElementById("batterNum").value = 1;
  clearBatterDetails();

  const batterNameInput = document.getElementById("batterName");
  const batterJerseyInput = document.getElementById("batterJersey");
  if (batterNameInput) batterNameInput.value = "";
  if (batterJerseyInput) batterJerseyInput.value = "";
  currentHand = "RH";
  document.querySelectorAll(".handBtn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.hand === currentHand);
  });

  if (nameInput) {
    nameInput.value = "";
    hideGameNameInput();
  }

  saveGameRowsToSupabase(currentGameId, []).catch(() => {});
  saveLog();

  if (previousGameId !== currentGameId) {
    populateGameSelect();
  }
}

function deleteGame() {
  const selectedGameId = document.getElementById("gameSelect").value || currentGameId;
  const confirmed = window.confirm(`Delete ${selectedGameId} and all of its data? This cannot be undone.`);
  if (!confirmed) return;

  const typedConfirm = window.prompt(`Type DELETE to permanently remove ${selectedGameId}:`, "");
  if (typedConfirm !== "DELETE") {
    window.alert("Delete canceled. You must type DELETE exactly to confirm.");
    return;
  }

  localStorage.removeItem("pitchLog_" + selectedGameId);
  localStorage.removeItem("gameName_" + selectedGameId);
  deleteGameRowsFromSupabase(selectedGameId).catch(() => {});

  const remainingIds = getStoredGameIds();
  if (remainingIds.length === 0) {
    const deletedNum = parseInt(selectedGameId.split("_")[1], 10);
    const nextNum = Number.isFinite(deletedNum) ? deletedNum + 1 : 1;
    currentGameId = "game_" + nextNum;

    localStorage.setItem("currentGameId", currentGameId);
    document.getElementById("logBody").innerHTML = "";
    resetCount();
    document.getElementById("batterNum").value = 1;
    saveLog();
    return;
  }

  if (selectedGameId === currentGameId) {
    currentGameId = remainingIds[0];
  }

  loadLog(currentGameId);
}

function initGamesPanelToggle() {
  const toggleBtn = document.getElementById("toggleGamesPanelBtn");
  const panelBody = document.getElementById("gamesPanelBody");

  toggleBtn.onclick = () => {
    const isHidden = panelBody.style.display === "none";
    panelBody.style.display = isHidden ? "block" : "none";
    toggleBtn.textContent = isHidden ? "Hide" : "Show";
    toggleBtn.setAttribute("aria-expanded", String(isHidden));
    saveUiState();
  };
}

function initLogPanelToggle() {
  const toggleBtn = document.getElementById("toggleLogPanelBtn");
  const panelBody = document.getElementById("logPanelBody");

  toggleBtn.onclick = () => {
    const isHidden = panelBody.style.display === "none";
    panelBody.style.display = isHidden ? "block" : "none";
    toggleBtn.textContent = isHidden ? "Hide" : "Show";
    toggleBtn.setAttribute("aria-expanded", String(isHidden));
    saveUiState();
  };
}

});

});
